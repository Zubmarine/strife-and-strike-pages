<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Strife &amp; Strike 在线对战">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Strife &amp; Strike">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Strife &amp; Strike</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #game-loading {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: #f0faf9;
      color: #163237;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    #game-loading-spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border: 3px solid rgba(27, 145, 151, .23);
      border-top-color: #00858d;
      border-radius: 50%;
      animation: game-loading-spin .8s linear infinite;
    }
    #game-loading-retry {
      margin-top: 12px;
      padding: 6px 14px;
      border: 1px solid currentColor;
      border-radius: 10px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    @keyframes game-loading-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      #game-loading { background: #112629; color: #d6efee; }
      #game-loading-spinner { border-top-color: #65d9dc; }
    }
    @media (prefers-reduced-motion: reduce) {
      #game-loading-spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="game-loading">
    <div>
      <div id="game-loading-spinner" aria-hidden="true"></div>
      <div id="game-loading-message" role="status">正在加载游戏…</div>
      <button type="button" id="game-loading-retry" hidden>重新加载</button>
    </div>
  </div>
  <script>
    (() => {
      const loading = document.getElementById('game-loading');
      const spinner = document.getElementById('game-loading-spinner');
      const message = document.getElementById('game-loading-message');
      const retry = document.getElementById('game-loading-retry');
      const slow = window.setTimeout(() => {
        message.textContent = '游戏仍在加载…';
        retry.hidden = false;
      }, 30000);
      const failed = () => {
        window.clearTimeout(slow);
        spinner.hidden = true;
        message.textContent = '加载失败，请重试';
        retry.hidden = false;
      };

      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('unhandledrejection', failed);
      window.addEventListener('sns-web-ready', () => {
        window.clearTimeout(slow);
        window.removeEventListener('unhandledrejection', failed);
        window.requestAnimationFrame(() => loading.remove());
      }, { once: true });

      const bootstrap = document.createElement('script');
      bootstrap.async = true;
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.addEventListener('error', failed, { once: true });
      document.body.append(bootstrap);
    })();
  </script>
</body>
</html>
